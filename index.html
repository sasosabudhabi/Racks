<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storage</title>
  <style>
    body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: #1f2328; background: #f6f8fa; }
    .banner { width: 100%; height: 320px; background: #222 url("Racks_Picture.jpg") top center / cover no-repeat; position: relative; }
    .banner h1 { position: absolute; top: 0; left: 0; right: 0; margin: 0; padding: 22px 24px; color: #fff; background: rgba(0,0,0,.68); font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1.15; font-weight: 800; text-shadow: 0 2px 5px rgba(0,0,0,.9); box-sizing: border-box; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
    p.desc { font-size: 1.05rem; }
    ul.files { list-style: none; padding: 0; }
    ul.files li { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; margin: 8px 0; }
    ul.files a { display: block; padding: 14px 16px; text-decoration: none; color: #0969da; }
    ul.files a:hover { background: #f0f6ff; }
    .type { float: right; color: #656d76; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="banner" role="img" aria-label="Storage Racks">
    <h1>Storage Racks</h1>
  </div>
  <main>
    <p class="desc">Documentation for the Storage Racks.</p>
    <h2>Documents</h2>
    <ul class="files">
      <li><a href="Racks_Load_Capacity_Certificate.pdf">01 Racks Load Capacity Certificate <span class="type">PDF</span></a></li>
      <li><a href="Racks_Load_Chart.pdf">02 Racks Load Chart <span class="type">PDF</span></a></li>
      <li><a href="Racks_Calibration_Certificate.pdf">01 Racks Calibration Certificate <span class="type">PDF</span></a></li>
      <li><a href="Racks_Calibration_Report.pdf">02 Racks Calibration Report <span class="type">PDF</span></a></li>
  </ul>
  </main>
</body>
</html>
